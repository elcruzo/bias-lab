services:
  - type: web
    name: bias-lab-api
    env: python
    runtime: python-3.11
    buildCommand: pip install --upgrade pip && pip install --timeout=300 --no-cache-dir -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: NEWSAPI_KEY
        sync: false
      - key: ENVIRONMENT
        value: production

services:
  - type: web
    name: bias-lab-api
    env: python
    buildCommand: ./render-build.sh
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: NEWSAPI_KEY
        sync: false
      - key: ENVIRONMENT
        value: production
